name: Scheduled Background Jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup stale uploads
        run: curl -fsS -X POST ${{ secrets.BACKEND_URL }}/api/cron/cleanup-stale-uploads
      - name: Check overdue bookings
        run: curl -fsS -X POST ${{ secrets.BACKEND_URL }}/api/cron/check-overdue-bookings
      - name: Expire unconfirmed bookings
        run: curl -fsS -X POST ${{ secrets.BACKEND_URL }}/api/cron/expire-unconfirmed
